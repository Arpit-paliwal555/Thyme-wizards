<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taming Thymeleaf</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body>
<header th:replace="~{fragments/page-header :: pageHeader(${pageTitle})}"></header>
<div class="mx-6">
    <a th:replace="fragments/menu-item :: menu-item('Dashboard', '/dashboard', ~{::#dashboard-icon})">
        <svg id="dashboard-icon"
             class="mr-3 h-6 w-6 text-gray-500 group-hover:text-gray-500 group-focus:textgray-
    600 transition ease-in-out duration-150"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0
        01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
    </a>
</div>
</body>
</html>
